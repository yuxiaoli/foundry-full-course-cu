<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 454" width="1000" height="454" role="img" aria-labelledby="title14 desc14">
<title id="title14">报名结束后，结果从另一次调用回来</title>
<desc id="desc14">Raffle 本地抽签 · 三名报名者 A、B、C。先请求：OPEN，接受符合门槛的报名；检查条件，经过时间 &gt; i_interval，有人且余额大于 0；CALCULATING，发出 VRF 请求，等待协调器。再回调：Mock 给出随机值 7，7 % 3 = 1 → B；结算本轮，记录 B，清空名单，尝试发送余额；回到 OPEN，更新上一轮时间，可接受新报名。回调交易成功后才保留清理、付款和事件。</desc>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
.main{font-size:33px;font-weight:700;fill:#102236}
.sub{font-size:17px;fill:#4a6077}
.row{font-size:17px;font-weight:700;fill:#45617a}
.heading{font-size:23px;font-weight:700} .detail{font-size:17px;fill:#1d3448}
.note{font-size:16px;fill:#334e63}
.edge,.fork{fill:none;stroke:#70869b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fork{stroke-dasharray:3 3;opacity:.8}
</style>
