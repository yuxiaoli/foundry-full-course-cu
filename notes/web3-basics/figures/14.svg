<text x="42" y="92" class="sub bound" data-right="958">Raffle 本地抽签 · 三名报名者 A、B、C</text>
<text x="42" y="122" class="row">先请求</text><rect x="42.0" y="136" width="286.6666666666667" height="100" rx="14" fill="#eaf5ff" stroke="#bed8f5"/><rect x="43.0" y="149" width="4" height="74" rx="2" fill="#bed8f5"/><text x="62.0" y="168" class="heading bound" fill="#144d7b" data-right="318.6666666666667">OPEN</text><text x="62.0" y="192" class="detail bound" data-right="318.6666666666667">接受符合门槛的报名</text><path d="M332.6666666666667 186.0 H350.6666666666667" class="edge" marker-end="url(#arrow14)"/><rect x="356.6666666666667" y="136" width="286.6666666666667" height="100" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="357.6666666666667" y="149" width="4" height="74" rx="2" fill="#b3dece"/><text x="376.6666666666667" y="168" class="heading bound" fill="#135c4c" data-right="633.3333333333334">检查条件</text><text x="376.6666666666667" y="192" class="detail bound" data-right="633.3333333333334">经过时间 &gt; i_interval</text><text x="376.6666666666667" y="214" class="detail bound" data-right="633.3333333333334">有人且余额大于 0</text><path d="M647.3333333333334 186.0 H665.3333333333334" class="edge" marker-end="url(#arrow14)"/><rect x="671.3333333333334" y="136" width="286.6666666666667" height="100" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="672.3333333333334" y="149" width="4" height="74" rx="2" fill="#efd8a0"/><text x="691.3333333333334" y="168" class="heading bound" fill="#7c4d13" data-right="948.0">CALCULATING</text><text x="691.3333333333334" y="192" class="detail bound" data-right="948.0">发出 VRF 请求</text><text x="691.3333333333334" y="214" class="detail bound" data-right="948.0">等待协调器</text><text x="42" y="271" class="row">再回调</text><rect x="42.0" y="285" width="286.6666666666667" height="100" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="43.0" y="298" width="4" height="74" rx="2" fill="#b3dece"/><text x="62.0" y="317" class="heading bound" fill="#135c4c" data-right="318.6666666666667">Mock 给出随机值 7</text><text x="62.0" y="341" class="detail bound" data-right="318.6