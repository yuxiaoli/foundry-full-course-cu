<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" width="1000" height="305" role="img" aria-labelledby="title11 desc11">
<title id="title11">同样收 ETH，怎样按美元设门槛</title>
<desc id="desc11">Fund Me 采用教学报价 2000 USD/ETH。换算路径：付款输入，0.003 ETH，即 3 × 10¹⁵ wei；查价并对齐尺度，8 位报价扩为 18 位，相乘后除一次 10¹⁸；和门槛比较，6 × 10¹⁸ ≥ 5 × 10¹⁸，这笔付款通过。0.002 ETH 折 4 USD，会回退；0.0025 ETH 折 5 USD，恰好通过。</desc>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
.main{font-size:33px;font-weight:700;fill:#102236}
.sub{font-size:17px;fill:#4a6077}
.row{font-size:17px;font-weight:700;fill:#45617a}
.heading{font-size:23px;font-weight:700} .detail{font-size:17px;fill:#1d3448}
.note{font-size:16px;fill:#334e63}
.edge,.fork{fill:none;stroke:#70869b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fork{stroke-dasharray:3 3;opacity:.8}
</style>
<defs><marker id="arrow11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70869b"/></marker></defs>
<rect width="1000" height="305" rx="22" fill="#f8fbfe" stroke="#d5e0eb"/>
<rect x="42" y="26" width="40" height="5" rx="2.5" fill="#2c7298"/>
<text x="42" y="66" class="main bound" data-right="958">同样收 ETH，怎样按美元设门槛</text>
<text x="42" y="92" class="sub bound" data-right="958">Fund Me 采用教学报价 2000 USD/ETH</text>
<text x="42" y="122" class="row">换算路径</text><rect x="42.0" y="136" width="286.6666666666667" height="100" rx="14" fill="#eaf5ff" stroke="#bed8f5"/><rect x="43.0" y="149" width="4" height="74" rx="2" fill="#bed8f5"/><text x="62.0" y="168" class="heading bound" fill="#144d7b" data-right="318.6666666666667">付款输入</text><text x="62.0" y="192" class="detail bound" data-right="318.6666666666667">0.003 ETH</text><text x="62.0" y="214" class="detail bound" data-right="318.6666666666667">即 3 × 10¹⁵ wei</text><path d="M332.6666666666667 186.0 H350.6666666666667" class="edge" marker-end="url(#arrow11)"/><rect x="356.6666666666667" y="136" width="286.6666666666667" height="100" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="357.6666666666667" y="149" width="4" height="74" rx="2" fill="#b3dece"/><text x="376.6666666666667" y="168" class="heading bound" fill="#135c4c" data-right="633.3333333333334">查价并对齐尺度</text><text x="376.6666666666667" y="192" class="detail bound" data-right="633.3333333333334">8 位报价扩为 18 位</text><text x="376.6666666666667" y="214" class="detail bound" data-right="633.3333333333334">相乘后除一次 10¹⁸</text><path d="M647.3333333333334 186.0 H665.3333333333334" class="edge" marker-end="url(#arrow11)"/><rect x="671.3333333333334" y="136" width="286.6666666666667" height="100" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="672.3333333333334" y="149" width="4" height="74" rx="2" fill="#efd8a0"/><text x="691.3333333333334" y="168" class="heading bound" fill="#7c4d13" data-right="948.0">和门槛比较</text><text x="691.3333333333334" y="192" class="detail bound" data-right="948.0">6 × 10¹⁸ ≥ 5 × 10¹⁸</text><text x="691.3333333333334" y="214" class="detail bound" data-right="948.0">这笔付款通过</text>
<rect x="42" y="262" width="916" height="34" rx="8" fill="#edf2f7"/>
<text x="55" y="284" class="note bound" data-right="950">0.002 ETH 折 4 USD，会回退；0.0025 ETH 折 5 USD，恰好通过。</text>
</svg>
