<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" width="1000" height="305" role="img" aria-labelledby="title06 desc06">
<title id="title06">同一个地址，两份网络状态</title>
<desc id="desc06">简化的锁定与表示凭证桥 · 忽略费用。从 A 到 B：源链 A，小周锁定 0.005 ETH，0.26 → 0.255 ETH；传递与消息验证，证明或受信验证者，核对来源、金额和目标；目标链 B，确认后记入 0.005 A-ETH，原生币余额仍为 0。抵达 B 链的是表示资产；源链和目标链分别产生可核对的记录。</desc>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
.main{font-size:33px;font-weight:700;fill:#102236}
.sub{font-size:17px;fill:#4a6077}
.row{font-size:17px;font-weight:700;fill:#45617a}
.heading{font-size:23px;font-weight:700} .detail{font-size:17px;fill:#1d3448}
.note{font-size:16px;fill:#334e63}
.edge,.fork{fill:none;stroke:#70869b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fork{stroke-dasharray:3 3;opacity:.8}
</style>
<defs><marker id="arrow06" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70869b"/></marker></defs>
<rect width="1000" height="305" rx="22" fill="#f8fbfe" stroke="#d5e0eb"/>
<rect x="42" y="26" width="40" height="5" rx="2.5" fill="#2c7298"/>
<text x="42" y="66" class="main bound" data-right="958">同一个地址，两份网络状态</text>
<text x="42" y="92" class="sub bound" data-right="958">简化的锁定与表示凭证桥 · 忽略费用</text>
<text x="42" y="122" class="row">从 A 到 B</text><rect x="42.0" y="136" width="286.6666666666667" height="100" rx="14" fill="#eaf5ff" stroke="#bed8f5"/><rect x="43.0" y="149" width="4" height="74" rx="2" fill="#bed8f5"/><text x="62.0" y="168" class="heading bound" fill="#144d7b" data-right="318.6666666666667">源链 A</text><text x="62.0" y="192" class="detail bound" data-right="318.6666666666667">小周锁定 0.005 ETH</text><text x="62.0" y="214" class="detail bound" data-right="318.6666666666667">0.26 → 0.255 ETH</text><path d="M332.6666666666667 186.0 H350.6666666666667" class="edge" marker-end="url(#arrow06)"/><rect x="356.6666666666667" y="136" width="286.6666666666667" height="100" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="357.6666666666667" y="149" width="4" height="74" rx="2" fill="#b3dece"/><text x="376.6666666666667" y="168" class="heading bound" fill="#135c4c" data-right="633.3333333333334">传递与消息验证</text><text x="376.6666666666667" y="192" class="detail bound" data-right="633.3333333333334">证明或受信验证者</text><text x="376.6666666666667" y="214" class="detail bound" data-right="633.3333333333334">核对来源、金额和目标</text><path d="M647.3333333333334 186.0 H665.3333333333334" class="edge" marker-end="url(#arrow06)"/><rect x="671.3333333333334" y="136" width="286.6666666666667" height="100" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="672.3333333333334" y="149" width="4" height="74" rx="2" fill="#efd8a0"/><text x="691.3333333333334" y="168" class="heading bound" fill="#7c4d13" data-right="948.0">目标链 B</text><text x="691.3333333333334" y="192" class="detail bound" data-right="948.0">确认后记入 0.005 A-ETH</text><text x="691.3333333333334" y="214" class="detail bound" data-right="948.0">原生币余额仍为 0</text>
<rect x="42" y="262" width="916" height="34" rx="8" fill="#edf2f7"/>
<text x="55" y="284" class="note bound" data-right="950">抵达 B 链的是表示资产；源链和目标链分别产生可核对的记录。</text>
</svg>
