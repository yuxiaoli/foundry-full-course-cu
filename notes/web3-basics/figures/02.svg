<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 438" width="1000" height="438" role="img" aria-labelledby="title02 desc02">
<title id="title02">签名随请求走，私钥留在钱包</title>
<desc id="desc02">转账 A 的授权和提交。生成授权：钱包内保管，小林的私钥，只用于生成签名；可传出的信封，金额、收款地址、链 ID，交易签名；RPC 与节点，提交签名请求，核对签名和规则。两种角色：地址，告诉别人把 ETH 送到哪里；签名，证明你授权了这一份请求。改动收款人或金额后，原签名不能验证那份修改的请求。</desc>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
.main{font-size:33px;font-weight:700;fill:#102236}
.sub{font-size:17px;fill:#4a6077}
.row{font-size:17px;font-weight:700;fill:#45617a}
.heading{font-size:23px;font-weight:700} .detail{font-size:17px;fill:#1d3448}
.note{font-size:16px;fill:#334e63}
.edge,.fork{fill:none;stroke:#70869b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fork{stroke-dasharray:3 3;opacity:.8}
</style>
<defs><marker id="arrow02" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70869b"/></marker></defs>
<rect width="1000" height="438" rx="22" fill="#f8fbfe" stroke="#d5e0eb"/>
<rect x="42" y="26" width="40" height="5" rx="2.5" fill="#2c7298"/>
<text x="42" y="66" class="main bound" data-right="958">签名随请求走，私钥留在钱包</text>
<text x="42" y="92" class="sub bound" data-right="958">转账 A 的授权和提交</text>
<text x="42" y="122" class="row">生成授权</text><rect x="42.0" y="136" width="286.6666666666667" height="100" rx="14" fill="#eaf5ff" stroke="#bed8f5"/><rect x="43.0" y="149" width="4" height="74" rx="2" fill="#bed8f5"/><text x="62.0" y="168" class="heading bound" fill="#144d7b" data-right="318.6666666666667">钱包内保管</text><text x="62.0" y="192" class="detail bound" data-right="318.6666666666667">小林的私钥</text><text x="62.0" y="214" class="detail bound" data-right="318.6666666666667">只用于生成签名</text><path d="M332.6666666666667 186.0 H350.6666666666667" class="edge" marker-end="url(#arrow02)"/><rect x="356.6666666666667" y="136" width="286.6666666666667" height="100" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="357.6666666666667" y="149" width="4" height="74" rx="2" fill="#b3dece"/><text x="376.6666666666667" y="168" class="heading bound" fill="#135c4c" data-right="633.3333333333334">可传出的信封</text><text x="376.6666666666667" y="192" class="detail bound" data-right="633.3333333333334">金额、收款地址、链 ID</text><text x="376.6666666666667" y="214" class="detail bound" data-right="633.3333333333334">交易签名</text><path d="M647.3333333333334 186.0 H665.3333333333334" class="edge" marker-end="url(#arrow02)"/><rect x="671.3333333333334" y="136" width="286.6666666666667" height="100" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="672.3333333333334" y="149" width="4" height="74" rx="2" fill="#efd8a0"/><text x="691.3333333333334" y="168" class="heading bound" fill="#7c4d13" data-right="948.0">RPC 与节点</text><text x="691.3333333333334" y="192" class="detail bound" data-right="948.0">提交签名请求</text><text x="691.3333333333334" y="214" class="detail bound" data-right="948.0">核对签名和规则</text><text x="42" y="271" class="row">两种角色</text><rect x="42.0" y="285" width="444.0" height="84" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="43.0" y="298" width="4" height="58" rx="2" fill="#b3dece"/><text x="62.0" y="317" class="heading bound" fill="#135c4c" data-right="476.0">地址</text><text x="62.0" y="341" class="detail bound" data-right="476.0">告诉别人把 ETH 送到哪里</text><path d="M490.0 327.0 H508.0" class="edge" marker-end="url(#arrow02)"/><rect x="514.0" y="285" width="444.0" height="84" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="515.0" y="298" width="4" height="58" rx="2" fill="#efd8a0"/><text x="534.0" y="317" class="heading bound" fill="#7c4d13" data-right="948.0">签名</text><text x="534.0" y="341" class="detail bound" data-right="948.0">证明你授权了这一份请求</text>
<rect x="42" y="395" width="916" height="34" rx="8" fill="#edf2f7"/>
<text x="55" y="417" class="note bound" data-right="950">改动收款人或金额后，原签名不能验证那份修改的请求。</text>
</svg>
