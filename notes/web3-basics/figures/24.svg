<text x="42" y="92" class="sub bound" data-right="958">课程跨链分叉模拟 · 发送前核对本金与实时余额</text>
<text x="42" y="122" class="row">源链到目标链</text><rect x="42.0" y="136" width="208.0" height="151" rx="14" fill="#eaf5ff" stroke="#bed8f5"/><rect x="43.0" y="149" width="4" height="125" rx="2" fill="#bed8f5"/><text x="62.0" y="168" class="heading bound" fill="#144d7b" data-right="240.0">Sepolia</text><text x="62.0" y="192" class="detail bound" data-right="240.0">Vault 存入，用户持</text><text x="62.0" y="214" class="detail bound" data-right="240.0">有 RBT</text><path d="M254.0 211.5 H272.0" class="edge" marker-end="url(#arrow24)"/><rect x="278.0" y="136" width="208.0" height="151" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="279.0" y="149" width="4" height="125" rx="2" fill="#b3dece"/><text x="298.0" y="168" class="heading bound" fill="#135c4c" data-right="476.0">源池</text><text x="298.0" y="197" class="heading bound" fill="#135c4c" data-right="476.0">lockOrBurn</text><text x="298.0" y="221" class="detail bound" data-right="476.0">减少源余额</text><text x="298.0" y="243" class="detail bound" data-right="476.0">编码用户利率</text><path d="M490.0 211.5 H508.0" class="edge" marker-end="url(#arrow24)"/><rect x="514.0" y="136" width="208.0" height="151" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="515.0" y="149" width="4" height="125" rx="2" fill="#efd8a0"/><text x="534.0" y="168" class="heading bound" fill="#7c4d13" data-right="712.0">CCIP 消息</text><text x="534.0" y="192" class="detail bound" data-right="712.0">校验来源和目标</text><text x="534.0" y="214" class="detail bound" data-right="712.0">数量 + 利率</text><path d="M726.0 211.5 H744.0" class="edge" marker-end="url(#arrow24)"/><rect x="750.0" y="136" width="208.0" height="151" rx="14" fill="#efeefd" stroke="#d9d0f1"/><rect x="751.0" y="149" width="4" height="125" rx="2" fill="#d9d0f1"/><text x="770.0" y="168" class="heading bound" fill="#4a3d7a" data-right="948.0">Arbitrum</text><text x="770.0" y="197" class="heading bound" fill="#4a3d7a" data-right="948.0">Sepolia</text><text x="770.0" y="221" class="detail bound" data-right="948.0">目标池</text><text x="770.0" y="243" class="detail bound" data-right="948.0">releaseOrMint</text><text x="770.0" y="265" class="detail bound" data-right="948.0">增加目标余额</text>
