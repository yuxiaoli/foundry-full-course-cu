<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 688" width="1000" height="688" role="img" aria-labelledby="title22 desc22">
<title id="title22">一棵树证明资格，一份签名授权操作</title>
<desc id="desc22">四叶树的教学结构 · B 的额度是 25。树的层级：Merkle 根，承诺全部名单。根下的两个子树：AB 子树，B 证明需要其兄弟 A；CD 子树，B 证明需要此子树。叶子：A，10；B，25；C，15；D，30。领取顺序：查已领取，该地址是否已领；验签，领取人签过本次数据；验证证明，叶子可还原名单根；记录并转给 B，实际接收方是 B。树图说明证明结构；编码和双层哈希按课程合约核对。</desc>
