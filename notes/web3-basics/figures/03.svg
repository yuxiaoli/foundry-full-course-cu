<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="title03 desc03">
<title id="title03">执行一次，余额和序号怎样变</title>
<desc id="desc03">普通转账 A · EIP-1559 教学数据。两份账本快照：执行前，小林 1.000000 ETH，小周 0.250000 ETH，小林 nonce = 7；转账和实付费，转账 0.010000 ETH，费用 0.000042 ETH，21,000 × 2 gwei；执行后，小林 0.989958 ETH，小周 0.260000 ETH，小林 nonce = 8。支付的费用分流：基础费销毁，0.0000315 ETH；优先费，0.0000105 ETH。查询余额只读取选定状态，回执描述一笔交易的执行。</desc>
