"84" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="357.6666666666667" y="282" width="4" height="58" rx="2" fill="#efd8a0"/><text x="376.6666666666667" y="301" class="heading bound" fill="#7c4d13" data-right="633.3333333333334">节点运营方参与验证</text><text x="376.6666666666667" y="325" class="detail bound" data-right="633.3333333333334">质押奖励产生</text><path d="M647.3333333333334 311.0 H665.3333333333334" class="edge" marker-end="url(#arrow17)"/><rect x="671.3333333333334" y="269" width="286.6666666666667" height="84" rx="14" fill="#efeefd" stroke="#d9d0f1"/><rect x="672.3333333333334" y="282" width="4" height="58" rx="2" fill="#d9d0f1"/><text x="691.3333333333334" y="301" class="heading bound" fill="#4a3d7a" data-right="948.0">奖励按规则分配</text><text x="691.3333333333334" y="325" class="detail bound" data-right="948.0">读案例对应的历史安排</text>
<rect x="42" y="379" width="916" height="34" rx="8" fill="#edf2f7"/>
