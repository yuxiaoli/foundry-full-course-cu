<rect width="1000" height="422" rx="22" fill="#f8fbfe" stroke="#d5e0eb"/>
<rect x="42" y="26" width="40" height="5" rx="2.5" fill="#2c7298"/>
<text x="42" y="66" class="main bound" data-right="958">流动性池和流动性质押是两条资金流</text>
<text x="42" y="92" class="sub bound" data-right="958">上行是无手续费的 v2 型纸面兑换，下行是历史角色示意</text>
