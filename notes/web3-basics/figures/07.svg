<rect width="1000" height="305" rx="22" fill="#f8fbfe" stroke="#d5e0eb"/>
<rect x="42" y="26" width="40" height="5" rx="2.5" fill="#2c7298"/>
<text x="42" y="66" class="main bound" data-right="958">Layer 0 常指哪一种职责</text>
<text x="42" y="92" class="sub bound" data-right="958">多链环境中遇到三个不同的用法</text>
<text x="42" y="122" class="row">按对象区分</text><rect x="42.0" y="136" width="286.6666666666667" height="100" rx="14" fill="#eaf5ff" stroke="#bed8f5"/><rect x="43.0" y="149" width="4" height="74" rx="2" fill="#bed8f5"/><text x="62.0" y="168" class="heading bound" fill="#144d7b" data-right="318.6666666666667">Polkadot</text><text x="62.0" y="192" class="detail bound" data-right="318.6666666666667">中继链与平行链</text><text x="62.0" y="214" class="detail bound" data-right="318.6666666666667">共享安全和验证</text><rect x="356.6666666666667" y="136" width="286.6666666666667" height="100" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="357.6666666666667" y="149" width="4" height="74" rx="2" fill="#b3dece"/><text x="376.6666666666667" y="168" class="heading bound" fill="#135c4c" data-right="633.3333333333334">bloXroute</text><text x="376.6666666666667" y="192" class="detail bound" data-right="633.3333333333334">传递区块和交易</text><text x="376.6666666666667" y="214" class="detail bound" data-right="633.3333333333334">传播基础设施</text><rect x="671.3333333333334" y="136" width="286.6666666666667" height="100" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="672.3333333333334" y="149" width="4" height="74" rx="2" fill="#efd8a0"/><text x="691.3333333333334" y="168" class="heading bound" fill="#7c4d13" data-right="948.0">LayerZero V2</text><text x="691.3333333333334" y="192" class="detail bound" data-right="948.0">两条链各有消息端点</text><text x="691.3333333333334" y="214" class="detail bound" data-right="948.0">按路径配置验证和交付</text>
