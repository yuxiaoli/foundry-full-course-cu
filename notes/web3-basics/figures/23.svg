ass="edge" marker-end="url(#arrow23)"/><rect x="356.6666666666667" y="285" width="286.6666666666667" height="100" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="357.6666666666667" y="298" width="4" height="74" rx="2" fill="#efd8a0"/><text x="376.6666666666667" y="317" class="heading bound" fill="#7c4d13" data-right="633.3333333333334">授权后更新实现槽</text><text x="376.6666666666667" y="341" class="detail bound" data-right="633.3333333333334">指向 BoxV2</text><path d="M647.3333333333334 335.0 H665.3333333333334" class="edge" marker-end="url(#arrow23)"/><rect x="671.3333333333334" y="285" width="286.6666666666667" height="100" rx="14" fill="#efeefd" stroke="#d9d0f1"/><rect x="672.3333333333334" y="298" width="4" height="74" rx="2" fill="#d9d0f1"/><text x="691.3333333333334" y="317" class="heading bound" fill="#4a3d7a" data-right="948.0">验证观察</text><text x="691.3333333333334" y="341" class="detail bound" data-right="948.0">同一代理地址</text><text x="691.3333333333334" y="363" class="detail bound" data-right="948.0">V2 可写读</text>
