<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 454" width="1000" height="454" role="img" aria-labelledby="title18 desc18">
<title id="title18">抵押价值下跌时，健康因子怎样变</title>
<desc id="desc18">课程 DSC 的示意阈值为 50%，例中不取出抵押。跟踪同一个头寸：初始，抵押 $300，债务 100，健康因子 1.5；价格下降，抵押 $180，债务 100，健康因子 0.9；自助偿还 20，抵押 $180，债务 80，健康因子 1.125。另一条路径：第三方清算，满足条件时偿还并取得抵押，按函数检查结果与条件。健康因子使用按阈值调整后的抵押价值，再除以债务。</desc>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
.main{font-size:33px;font-weight:700;fill:#102236}
.sub{font-size:17px;fill:#4a6077}
.row{font-size:17px;font-weight:700;fill:#45617a}
.heading{font-size:23px;font-weight:700} .detail{font-size:17px;fill:#1d3448}
.note{font-size:16px;fill:#334e63}
.edge,.fork{fill:none;stroke:#70869b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fork{stroke-dasharray:3 3;opacity:.8}
</style>
<defs><marker id="arrow18" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70869b"/></marker></defs>
<rect width="1000" height="454" rx="22" fill="#f8fbfe" stroke="#d5e0eb"/>
<rect x="42" y="26" width="40" height="5" rx="2.5" fill="#2c7298"/>
<text x="42" y="66" class="main bound" data-right="958">抵押价值下跌时，健康因子怎样变</text>
<text x="42" y="92" class="sub bound" data-right="958">课程 DSC 的示意阈值为 50%，例中不取出抵押</text>
<text x="42" y="122" class="row">跟踪同一个头寸</text><rect x="42.0" y="136" width="286.6666666666667" height="100" rx="14" fill="#eaf5ff" stroke="#bed8f5"/><rect x="43.0" y="149" width="4" height="74" rx="2" fill="#bed8f5"/><text x="62.0" y="168" class="heading bound" fill="#144d7b" data-right="318.6666666666667">初始</text><text x="62.0" y="192" class="detail bound" data-right="318.6666666666667">抵押 $300，债务 100</text><text x="62.0" y="214" class="detail bound" data-right="318.6666666666667">健康因子 1.5</text><path d="M332.6666666666667 186.0 H350.6666666666667" class="edge" marker-end="url(#arrow18)"/><rect x="356.6666666666667" y="136" width="286.6666666666667" height="100" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="357.6666666666667" y="149" width="4" height="74" rx="2" fill="#b3dece"/><text x="376.6666666666667" y="168" class="heading bound" fill="#135c4c" data-right="633.3333333333334">价格下降</text><text x="376.6666666666667" y="192" class="detail bound" data-right="633.3333333333334">抵押 $180，债务 100</text><text x="376.6666666666667" y="214" class="detail bound" data-right="633.3333333333334">健康因子 0.9</text><path d="M647.3333333333334 186.0 H665.3333333333334" class="edge" marker-end="url(#arrow18)"/><rect x="671.3333333333334" y="136" width="286.6666666666667" height="100" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="672.3333333333334" y="149" width="4" height="74" rx="2" fill="#efd8a0"/><text x="691.3333333333334" y="168" class="heading bound" fill="#7c4d13" data-right="948.0">自助偿还 20</text><text x="691.3333333333334" y="192" class="detail bound" data-right="948.0">抵押 $180，债务 80</text><text x="691.3333333333334" y="214" class="detail bound" data-right="948.0">健康因子 1.125</text><text x="42" y="271" class="row">另一条路径</text><rect x="42.0" y="285" width="916.0" height="100" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="43.0" y="298" width="4" height="74" rx="2" fill="#b3dece"/><text x="62.0" y="317" class="heading bound" fill="#135c4c" data-right="948.0">第三方清算</text><text x="62.0" y="341" class="detail bound" data-right="948.0">满足条件时偿还并取得抵押</text><text x="62.0" y="363" class="detail bound" data-right="948.0">按函数检查结果与条件</text>
<rect x="42" y="411" width="916" height="34" rx="8" fill="#edf2f7"/>
<text x="55" y="433" class="note bound" data-right="950">健康因子使用按阈值调整后的抵押价值，再除以债务。</text>
</svg>
