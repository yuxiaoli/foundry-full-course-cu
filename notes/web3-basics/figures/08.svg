<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" width="1000" height="305" role="img" aria-labelledby="title08 desc08">
<title id="title08">在同一个合约地址读、写、再读</title>
<desc id="desc08">Remix VM 中的最小合约。逐步执行：编译与部署，Solidity 0.8.19，得到一个新地址；第一次读取，retrieve() → 0，只读调用；写入数字，store(777)，模拟链上的交易；再次读取，读回 777，同一个地址。状态跟着合约地址保留，重新部署会得到独立实例。</desc>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
.main{font-size:33px;font-weight:700;fill:#102236}
.sub{font-size:17px;fill:#4a6077}
.row{font-size:17px;font-weight:700;fill:#45617a}
.heading{font-size:23px;font-weight:700} .detail{font-size:17px;fill:#1d3448}
.note{font-size:16px;fill:#334e63}
.edge,.fork{fill:none;stroke:#70869b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fork{stroke-dasharray:3 3;opacity:.8}
</style>
<defs><marker id="arrow08" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70869b"/></marker></defs>
<rect width="1000" height="305" rx="22" fill="#f8fbfe" stroke="#d5e0eb"/>
<rect x="42" y="26" width="40" height="5" rx="2.5" fill="#2c7298"/>
<text x="42" y="66" class="main bound" data-right="958">在同一个合约地址读、写、再读</text>
<text x="42" y="92" class="sub bound" data-right="958">Remix VM 中的最小合约</text>
<text x="42" y="122" class="row">逐步执行</text><rect x="42.0" y="136" width="208.0" height="100" rx="14" fill="#eaf5ff" stroke="#bed8f5"/><rect x="43.0" y="149" width="4" height="74" rx="2" fill="#bed8f5"/><text x="62.0" y="168" class="heading bound" fill="#144d7b" data-right="240.0">编译与部署</text><text x="62.0" y="192" class="detail bound" data-right="240.0">Solidity 0.8.19</text><text x="62.0" y="214" class="detail bound" data-right="240.0">得到一个新地址</text><path d="M254.0 186.0 H272.0" class="edge" marker-end="url(#arrow08)"/><rect x="278.0" y="136" width="208.0" height="100" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="279.0" y="149" width="4" height="74" rx="2" fill="#b3dece"/><text x="298.0" y="168" class="heading bound" fill="#135c4c" data-right="476.0">第一次读取</text><text x="298.0" y="192" class="detail bound" data-right="476.0">retrieve() → 0</text><text x="298.0" y="214" class="detail bound" data-right="476.0">只读调用</text><path d="M490.0 186.0 H508.0" class="edge" marker-end="url(#arrow08)"/><rect x="514.0" y="136" width="208.0" height="100" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="515.0" y="149" width="4" height="74" rx="2" fill="#efd8a0"/><text x="534.0" y="168" class="heading bound" fill="#7c4d13" data-right="712.0">写入数字</text><text x="534.0" y="192" class="detail bound" data-right="712.0">store(777)</text><text x="534.0" y="214" class="detail bound" data-right="712.0">模拟链上的交易</text><path d="M726.0 186.0 H744.0" class="edge" marker-end="url(#arrow08)"/><rect x="750.0" y="136" width="208.0" height="100" rx="14" fill="#efeefd" stroke="#d9d0f1"/><rect x="751.0" y="149" width="4" height="74" rx="2" fill="#d9d0f1"/><text x="770.0" y="168" class="heading bound" fill="#4a3d7a" data-right="948.0">再次读取</text><text x="770.0" y="192" class="detail bound" data-right="948.0">读回 777</text><text x="770.0" y="214" class="detail bound" data-right="948.0">同一个地址</text>
<rect x="42" y="262" width="916" height="34" rx="8" fill="#edf2f7"/>
<text x="55" y="284" class="note bound" data-right="950">状态跟着合约地址保留，重新部署会得到独立实例。</text>
</svg>
