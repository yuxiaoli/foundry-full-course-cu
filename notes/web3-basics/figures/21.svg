<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 438" width="1000" height="438" role="img" aria-labelledby="title21 desc21">
<title id="title21">同一提案怎样真的更新 Box</title>
<desc id="desc21">课程 testGovernanceUpdatesBox 的合约调用。提案与投票：VOTER，delegate 与投票；Governor，propose、castVote、queue；TimeLock，登记操作与等待时间。执行与复核：外部发起 execute，供 Governor 执行的具体调用；TimeLock → Box，所有者权限允许 store(777)；读取并断言，retrieve() == 777。课例描述字符串写的是 1，实际编码和末尾断言均为 777。</desc>
<style>
text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif}
.main{font-size:33px;font-weight:700;fill:#102236}
.sub{font-size:17px;fill:#4a6077}
.row{font-size:17px;font-weight:700;fill:#45617a}
.heading{font-size:23px;font-weight:700} .detail{font-size:17px;fill:#1d3448}
.note{font-size:16px;fill:#334e63}
.edge,.fork{fill:none;stroke:#70869b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fork{stroke-dasharray:3 3;opacity:.8}
</style>
<defs><marker id="arrow21" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#70869b"/></marker></defs>
<rect width="1000" height="438" rx="22" fill="#f8fbfe" stroke="#d5e0eb"/>
<rect x="42" y="26" width="40" height="5" rx="2.5" fill="#2c7298"/>
<text x="42" y="66" class="main bound" data-right="958">同一提案怎样真的更新 Box</text>
<text x="42" y="92" class="sub bound" data-right="958">课程 testGovernanceUpdatesBox 的合约调用</text>
<text x="42" y="122" class="row">提案与投票</text><rect x="42.0" y="136" width="286.6666666666667" height="100" rx="14" fill="#eaf5ff" stroke="#bed8f5"/><rect x="43.0" y="149" width="4" height="74" rx="2" fill="#bed8f5"/><text x="62.0" y="168" class="heading bound" fill="#144d7b" data-right="318.6666666666667">VOTER</text><text x="62.0" y="192" class="detail bound" data-right="318.6666666666667">delegate 与投票</text><path d="M332.6666666666667 186.0 H350.6666666666667" class="edge" marker-end="url(#arrow21)"/><rect x="356.6666666666667" y="136" width="286.6666666666667" height="100" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="357.6666666666667" y="149" width="4" height="74" rx="2" fill="#b3dece"/><text x="376.6666666666667" y="168" class="heading bound" fill="#135c4c" data-right="633.3333333333334">Governor</text><text x="376.6666666666667" y="192" class="detail bound" data-right="633.3333333333334">propose、castVote、</text><text x="376.6666666666667" y="214" class="detail bound" data-right="633.3333333333334">queue</text><path d="M647.3333333333334 186.0 H665.3333333333334" class="edge" marker-end="url(#arrow21)"/><rect x="671.3333333333334" y="136" width="286.6666666666667" height="100" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="672.3333333333334" y="149" width="4" height="74" rx="2" fill="#efd8a0"/><text x="691.3333333333334" y="168" class="heading bound" fill="#7c4d13" data-right="948.0">TimeLock</text><text x="691.3333333333334" y="192" class="detail bound" data-right="948.0">登记操作与等待时间</text><text x="42" y="271" class="row">执行与复核</text><rect x="42.0" y="285" width="286.6666666666667" height="84" rx="14" fill="#e9f7f2" stroke="#b3dece"/><rect x="43.0" y="298" width="4" height="58" rx="2" fill="#b3dece"/><text x="62.0" y="317" class="heading bound" fill="#135c4c" data-right="318.6666666666667">外部发起 execute</text><text x="62.0" y="341" class="detail bound" data-right="318.6666666666667">供 Governor 执行的具体调用</text><path d="M332.6666666666667 327.0 H350.6666666666667" class="edge" marker-end="url(#arrow21)"/><rect x="356.6666666666667" y="285" width="286.6666666666667" height="84" rx="14" fill="#fff4d9" stroke="#efd8a0"/><rect x="357.6666666666667" y="298" width="4" height="58" rx="2" fill="#efd8a0"/><text x="376.6666666666667" y="317" class="heading bound" fill="#7c4d13" data-right="633.3333333333334">TimeLock → Box</text><text x="376.6666666666667" y="341" class="detail bound" data-right="633.3333333333334">所有者权限允许 store(777)</text><path d="M647.3333333333334 327.0 H665.3333333333334" class="edge" marker-end="url(#arrow21)"/><rect x="671.3333333333334" y="285" width="286.6666666666667" height="84" rx="14" fill="#efeefd" stroke="#d9d0f1"/><rect x="672.3333333333334" y="298" width="4" height="58" rx="2" fill="#d9d0f1"/><text x="691.3333333333334" y="317" class="heading bound" fill="#4a3d7a" data-right="948.0">读取并断言</text><text x="691.3333333333334" y="341" class="detail bound" data-right="948.0">retrieve() == 777</text>
<rect x="42" y="395" width="916" height="34" rx="8" fill="#edf2f7"/>
<text x="55" y="417" class="note bound" data-right="950">课例描述字符串写的是 1，实际编码和末尾断言均为 777。</text>
